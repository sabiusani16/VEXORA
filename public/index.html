<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090B12">
<title>VEXORA — Connect Beyond Limits.</title>
<style>
:root{--bg:#090B12;--card:#171827;--c2:#202238;--line:#2a2c45;--p:#7C4DFF;--p2:#B44DFF;--t:#f3f4fb;--d:#8f93b3;--on:#2ecc71;--red:#ff4d6d;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
body{background:var(--bg);color:var(--t);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
button,input,textarea{font:inherit;color:inherit;background:none;border:0}button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:0;z-index:20;background:rgba(9,11,18,.9);backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 10px) 0 8px}
.bar{display:flex;align-items:center;gap:6px}.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand b{font-size:25px;letter-spacing:1px;font-weight:800;line-height:1}.brand b span{color:var(--p)}.brand small{display:block;color:var(--d);font-size:12px;margin-top:2px}
.ib{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}.ib:active{background:var(--card)}
.badge{position:absolute;top:2px;right:0;min-width:18px;height:18px;border-radius:9px;background:var(--red);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
#sb{display:none;margin-top:8px}#sb.on{display:block}#sb input{width:100%;padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);outline:0}
.stories{display:flex;gap:12px;overflow-x:auto;padding:8px 14px 12px;margin:0 -14px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}
.st{flex:none;width:76px;text-align:center;font-size:13px}.ring{width:72px;height:72px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--p),#3d7bff,var(--p2));margin:0 auto 6px}.ring.seen{background:var(--line)}
.ring .av{width:100%;height:100%;border:3px solid var(--bg);font-size:22px}
.mk{flex:none;width:92px;height:128px;border-radius:18px;background:linear-gradient(160deg,#3a2480,var(--card));display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;padding:10px 6px;font-size:13px;line-height:1.2}
.mk i{width:40px;height:40px;border-radius:50%;background:var(--p);display:grid;place-items:center}
.more{width:72px;height:72px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin:0 auto 6px;color:var(--p)}
.av{position:relative;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;font-weight:700;font-size:15px;flex:none;color:#fff}.av.sm{width:34px;height:34px;font-size:12px}
.av .dot{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--on);border:2px solid var(--card)}
.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.row{display:flex;gap:10px;align-items:center}.q{flex:1;min-width:0;background:var(--c2);border-radius:24px;padding:13px 16px;outline:0;border:1px solid var(--line)}.q:focus{border-color:var(--p)}
.pbtn{background:linear-gradient(135deg,var(--p),var(--p2));padding:11px 16px;border-radius:22px;font-weight:700;display:flex;gap:6px;align-items:center}.pbtn .i{width:18px;height:18px}.pbtn:disabled{opacity:.45}
.acts{display:flex;margin-top:12px}.acts button{flex:1;display:flex;gap:8px;justify-content:center;align-items:center;padding:8px 4px;border-radius:12px;font-size:15px}.acts button+button{border-left:1px solid var(--line)}
.hint{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:12px;color:var(--d)}.hint button{display:flex;gap:5px;align-items:center;color:var(--p);font-size:13px}.hint .i{width:15px;height:15px}
#pv{position:relative;margin-top:10px}#pv .x{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border-radius:50%;width:32px;height:32px;display:grid;place-items:center}
.ph{display:flex;gap:12px;align-items:center}.ph>div{flex:1;min-width:0}.ph b{display:block}.ph small{color:var(--d);display:flex;gap:5px;align-items:center}.ph small .i{width:14px;height:14px}.fl{font-weight:400;color:var(--d);font-size:14px}
.pt{margin:10px 0;font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere}.pm{display:block;width:100%;border-radius:14px;max-height:420px;object-fit:cover;background:#000}
.stat{display:flex;align-items:center;gap:12px;margin-top:12px;position:relative}.stat button{display:flex;align-items:center;gap:6px;color:var(--d);padding:6px 4px;font-size:15px}.sp{flex:1}
.rb{display:flex;margin-right:8px}.rb i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--card);margin-right:-8px;font-style:normal;font-size:14px}
.on-l{color:#4a8dff!important}.on-h{color:var(--red)!important}.on-s{color:var(--p)!important}.on-s .i{fill:currentColor}
.pick{position:absolute;bottom:46px;left:0;background:var(--c2);border:1px solid var(--line);border-radius:28px;padding:6px 10px;display:none;gap:6px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.5)}.pick.on{display:flex}.pick button{font-size:26px;padding:4px 8px;transition:transform .15s}.pick button:active{transform:scale(1.3)}
.cms{margin-top:10px;display:none}.cms.on{display:block}.cm{display:flex;gap:8px;margin-bottom:8px}.cm p{background:var(--c2);padding:8px 12px;border-radius:16px;font-size:15px;overflow-wrap:anywhere}.cm b{display:block;font-size:13px}
.cin{display:flex;gap:6px;align-items:center}.cin input{flex:1;min-width:0;background:var(--c2);border-radius:20px;padding:10px 14px;outline:0}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:40;align-items:flex-end}#ov.on{display:flex}
#sh{width:100%;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);animation:up .22s ease-out;max-height:80vh;overflow:auto}@keyframes up{from{transform:translateY(40px);opacity:0}}
#sh h3{margin-bottom:8px}.mi{display:flex;gap:12px;align-items:center;width:100%;padding:13px 6px;text-align:left;border-radius:12px}.mi:active{background:var(--c2)}.mi.del{color:var(--red)}.mi small{color:var(--d);display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{background:var(--c2);padding:10px 14px;border-radius:20px}
.sw{display:flex;gap:10px;margin:12px 0}.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}.sw button.on{border-color:#fff}
#stx{width:100%;background:var(--c2);border-radius:14px;padding:12px;min-height:90px;outline:0;resize:none}
.big{width:100%;margin-top:6px;justify-content:center;padding:13px}
#sv{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}#sv.on{display:flex}
.pg{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:12px;right:12px;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}.pg i{display:block;height:100%;background:#fff;animation:fill 5s linear forwards}@keyframes fill{from{width:0}to{width:100%}}
.sh{position:absolute;top:calc(env(safe-area-inset-top) + 20px);left:14px;right:8px;display:flex;justify-content:space-between;align-items:center;z-index:2}.sh div{display:flex;gap:10px;align-items:center;font-weight:700}
.sx{font-size:28px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}.zl,.zr{position:absolute;top:80px;bottom:0}.zl{left:0;width:35%}.zr{right:0;width:65%}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);background:#2a2c45;padding:11px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:.25s;z-index:60;font-size:14px;max-width:90%;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
.sk{height:200px;position:relative;overflow:hidden}.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:shm 1.2s infinite}@keyframes shm{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.empty{text-align:center;color:var(--d);padding:40px 16px}.empty .i{width:44px;height:44px;margin-bottom:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap"><div class="bar">
<div class="brand"><svg width="44" height="40" viewBox="0 0 44 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B44DFF"/><stop offset="1" stop-color="#3d7bff"/></linearGradient></defs><path d="M2 4h10l10 22L32 4h10L27 36H17z" fill="url(#lg)"/></svg><div><b>VEXO<span>RA</span></b><small>Connect Beyond Limits.</small></div></div>
<button class="ib" id="bs" data-i="search" aria-label="Search"></button>
<button class="ib" id="bn" aria-label="Notifications"><span data-i="bell"></span><span class="badge" id="bb">3</span></button>
</div><div id="sb"><input id="sq" type="search" placeholder="Search posts or people" autocomplete="off"></div></div></header>
<main class="wrap">
<div class="stories" id="stories"></div>
<section class="card" id="comp">
<div class="row"><span id="me"></span><input class="q" id="q" placeholder="What's on your mind?" maxlength="1000" autocomplete="off" enterkeyhint="send"><button class="pbtn" id="pb" disabled><span data-i="pen"></span>Post</button></div>
<div id="pv"></div>
<div class="acts"><button id="bi"><span data-i="img" style="color:#ff4d6d"></span>Photo</button><button id="bv"><span data-i="vid" style="color:#a45cff"></span>Video</button><button id="bf"><span data-i="smile" style="color:#ffc83d"></span>Feeling</button></div>
<div class="hint"><button id="vis"></button><span id="mode"></span></div>
<input type="file" id="fi" accept="image/*" hidden><input type="file" id="fv" accept="video/*" hidden>
</section>
<div id="feed"></div>
</main>
<div id="ov"><div id="sh"></div></div><div id="sv"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
const $=(s)=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',bell:'<path d="M18 16v-5a6 6 0 10-12 0v5l-2 2h16zM10 21h4"/>',plus:'<path d="M12 5v14M5 12h14"/>',img:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.5"/><path d="M4 18l5-5 4 4 3-3 4 4"/>',vid:'<rect x="2" y="6" width="13" height="12" rx="3"/><path d="M16 10l6-3v10l-6-3z"/>',smile:'<circle cx="12" cy="12" r="9"/><path d="M8 14a5 5 0 008 0M9 9.5h.01M15 9.5h.01"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',dots:'<path d="M12 5h.01M12 12h.01M12 19h.01" stroke-width="3"/>',cmt:'<path d="M4 5h16v11H9l-5 4z"/>',share:'<path d="M15 4l6 6-6 6v-4c-6 0-9 2-11 6 1-7 4-11 11-12z"/>',save:'<path d="M6 3h12v18l-6-4-6 4z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',send:'<path d="M3 11l18-8-8 18-2-8z"/>',grid:'<rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',link:'<path d="M10 14a4 4 0 006 0l3-3a4 4 0 00-6-6l-1 1M14 10a4 4 0 00-6 0l-3 3a4 4 0 006 6l1-1"/>',eye:'<path d="M3 3l18 18M10 6a9 9 0 0110 6 9 9 0 01-3 3.5M6.5 7.5A9 9 0 002 12a9 9 0 0010 6"/>',pen:'<path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"/>'};
const I=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24">${P[n]}</svg>`;
const ME='You',KEY='vx_posts_v1';
const hue=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const av=(n,c='',on)=>`<span class="av ${c}" style="background:linear-gradient(135deg,hsl(${hue(n)} 70% 55%),hsl(${(hue(n)+55)%360} 70% 38%))">${esc(n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase())}${on?'<i class="dot"></i>':''}</span>`;
const ago=t=>{const s=(Date.now()-t)/1e3;return s<60?'Just now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1).replace('.0','')+'K':n;
const svg=s=>'data:image/svg+xml,'+encodeURIComponent(s);
const ART={
city:svg('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340"><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2a7a"/><stop offset=".6" stop-color="#ff8a4c"/><stop offset="1" stop-color="#ffd27a"/></linearGradient></defs><rect width="800" height="340" fill="url(#a)"/><circle cx="200" cy="215" r="34" fill="#ffe9a8"/><g fill="#1d1b36"><path d="M0 290h800v50H0zM30 290v-40h50v40zM100 290v-60h40v60zM160 290v-30h60v30zM300 290v-50h60v50zM380 290v-35h50v35z"/><path d="M500 290v-60h180v60zM530 232a60 55 0 01120 0z"/><rect x="480" y="150" width="12" height="140"/><rect x="690" y="150" width="12" height="140"/><rect x="725" y="190" width="10" height="100"/><path d="M486 150l-8-18h24zM696 150l-8-18h24z"/></g></svg>'),
dawn:svg('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340"><defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5aa7ff"/><stop offset="1" stop-color="#ffe7a8"/></linearGradient></defs><rect width="800" height="340" fill="url(#b)"/><circle cx="600" cy="110" r="46" fill="#fff6c8"/><path d="M0 250q200-80 400-10t400-30v130H0z" fill="#2f9e6b"/><path d="M0 295q250-60 450-5t350-20v70H0z" fill="#1f7a52"/></svg>')};
const now=Date.now();
const demo=()=>[
{id:'d1',u:'Abdullahi Bello',on:1,t:now-72e5,vis:'public',text:'Life is better when you are surrounded by positive people. 💯❤️',art:'city',l:1100,h:96,cn:246,sh:126,me:null,sv:0,cm:[{u:'Aisha Yusuf',x:'Well said! 🙌'},{u:'Mustapha Danjuma',x:'Amin. Beautiful view.'}]},
{id:'d2',u:'Zainab Musa',on:1,t:now-144e5,vis:'public',text:'Good morning everyone! ☀️\nHave a blessed day ahead. ❤️',art:'dawn',l:864,h:213,cn:12,sh:41,me:null,sv:0,cm:[]},
{id:'d3',u:'Mustapha Danjuma',on:0,t:now-864e5,vis:'friends',text:'Building something new with great people. Stay tuned. 🚀',l:342,h:28,cn:3,sh:9,me:null,sv:0,cm:[]}];
let posts;try{posts=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!Array.isArray(posts))posts=demo();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(posts.map(p=>p.vid?{...p,vid:null}:p)))}catch(e){toast('Storage is full. This post is kept for this session only.')}};
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)};
const copy=async t=>{try{await navigator.clipboard.writeText(t);toast('Link copied')}catch(e){toast(t)}};
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=I(e.dataset.i));$('#me').innerHTML=av(ME);
/* ---------- sheet ---------- */
const sheet=h=>{$('#sh').innerHTML=h;$('#ov').classList.add('on')},closeSheet=()=>$('#ov').classList.remove('on');
$('#ov').onclick=e=>{if(e.target.id==='ov')closeSheet()};
/* ---------- stories ---------- */
const GR=[['#7C4DFF','#ff4d9d'],['#0f9b8e','#2d6cdf'],['#ff8a4c','#b44dff'],['#2d6cdf','#7C4DFF'],['#e0533d','#ffb347']];
const stories=[{n:'Aisha',on:1,g:GR[0],x:'Alhamdulillah for another beautiful day 🌸'},{n:'Mustapha',on:1,g:GR[1],x:'New project loading… 🚀'},{n:'Zainab',on:1,g:GR[2],x:'Good morning everyone ☀️'},{n:'Fatima',on:0,g:GR[3],x:'Weekend plans? 🎉'}];
let sv={i:0,t:0};
function renderStories(){$('#stories').innerHTML=`<button class="mk" id="mks"><i>${I('plus')}</i>Create<br>Story</button>`+stories.map((s,i)=>`<button class="st" data-s="${i}"><div class="ring ${s.seen?'seen':''}">${av(s.n,'',s.on)}</div>${esc(s.n)}</button>`).join('')+`<button class="st" id="mre"><div class="more">${I('grid')}</div>More</button>`}
function story(i){clearTimeout(sv.t);if(i<0)i=0;if(i>=stories.length){$('#sv').classList.remove('on');renderStories();return}
sv.i=i;const s=stories[i];s.seen=1;const e=$('#sv');e.style.background=`linear-gradient(160deg,${s.g[0]},${s.g[1]})`;
e.innerHTML=`<div class="pg"><i></i></div><div class="sh"><div>${av(s.n)}${esc(s.n)}</div><button class="ib" data-k="x" aria-label="Close">${I('x')}</button></div><p class="sx">${esc(s.x)}</p><div class="zl" data-k="p"></div><div class="zr" data-k="n"></div>`;
e.classList.add('on');sv.t=setTimeout(()=>story(i+1),5000)}
$('#sv').onclick=e=>{const k=e.target.closest('[data-k]');if(!k)return;if(k.dataset.k==='x'){clearTimeout(sv.t);$('#sv').classList.remove('on');renderStories()}else story(sv.i+(k.dataset.k==='n'?1:-1))};
$('#stories').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.s)story(+b.dataset.s);else if(b.id==='mre')toast('You are all caught up');else if(b.id==='mks'){let c=0;
sheet(`<h3>Create story</h3><textarea id="stx" maxlength="120" placeholder="Share a quick thought…"></textarea><div class="sw">${GR.map((g,i)=>`<button data-m="sw" data-k="${i}" class="${i?'':'on'}" style="background:linear-gradient(135deg,${g[0]},${g[1]})" aria-label="Colour ${i+1}"></button>`).join('')}</div><button class="pbtn big" data-m="mk">Share story</button>`)}};
/* ---------- feed ---------- */
let filter='';
const media=p=>p.vid?`<video class="pm" src="${p.vid}" controls playsinline preload="metadata"></video>`:p.img?`<img class="pm" alt="" src="${p.img}">`:p.art?`<img class="pm" alt="" src="${ART[p.art]}">`:'';
const stat=p=>`<div class="pick" id="k-${p.id}"><button data-a="pick" data-k="l" aria-label="Like">👍</button><button data-a="pick" data-k="h" aria-label="Love">❤️</button></div><button data-a="react" aria-label="React" class="${p.me==='l'?'on-l':p.me==='h'?'on-h':''}"><span class="rb"><i style="background:#2f6bff">👍</i><i style="background:#ff4d6d">❤️</i></span>${fmt(p.l+p.h)}</button><button data-a="cmt" aria-label="Comments">${I('cmt')}${fmt(p.cn+p.cm.length)}</button><button data-a="share" aria-label="Share">${I('share')}${fmt(p.sh)}</button><span class="sp"></span><button data-a="save" aria-label="Bookmark" class="${p.sv?'on-s':''}">${I('save')}</button>`;
const cms=p=>p.cm.map(c=>`<div class="cm">${av(c.u,'sm')}<p><b>${esc(c.u)}</b>${esc(c.x)}</p></div>`).join('')+`<div class="cin"><input placeholder="Write a comment…" maxlength="300" enterkeyhint="send"><button class="ib" data-a="send" aria-label="Send">${I('send')}</button></div>`;
const postHTML=p=>`<article class="card" id="p-${p.id}" data-id="${p.id}"><div class="ph">${av(p.u,'',p.on)}<div><b>${esc(p.u)}${p.feel?` <span class="fl">is feeling ${esc(p.feel)}</span>`:''}</b><small>${ago(p.t)} · ${I(p.vis==='public'?'globe':'lock')}</small></div><button class="ib" data-a="menu" aria-label="More options">${I('dots')}</button></div>${p.text?`<p class="pt">${esc(p.text)}</p>`:''}${media(p)}<div class="stat" id="s-${p.id}">${stat(p)}</div><div class="cms" id="c-${p.id}"></div></article>`;
const upd=p=>{$('#s-'+p.id).innerHTML=stat(p)};
function renderFeed(){const q=filter.toLowerCase(),l=posts.filter(p=>!p.hid&&(!q||(p.text+p.u).toLowerCase().includes(q)));
$('#feed').innerHTML=l.length?l.map(postHTML).join(''):`<div class="empty">${I(q?'search':'smile')}<p>${q?'No results for “'+esc(filter)+'”':'Nothing here yet. Share your first post!'}</p></div>`}
$('#feed').innerHTML='<div class="card sk"></div><div class="card sk"></div>';setTimeout(renderFeed,700);
$('#feed').onclick=async e=>{const b=e.target.closest('[data-a]'),c=e.target.closest('article');if(!b||!c)return;const p=posts.find(x=>x.id===c.dataset.id),a=b.dataset.a;
document.querySelectorAll('.pick.on').forEach(k=>{if(a!=='react'||k.id!=='k-'+p.id)k.classList.remove('on')});
if(a==='react'){if(p.me){p[p.me]--;p.me=null;upd(p);save()}else $('#k-'+p.id).classList.toggle('on')}
else if(a==='pick'){const k=b.dataset.k;p[k]++;p.me=k;upd(p);save()}
else if(a==='cmt'){const e2=$('#c-'+p.id);e2.classList.toggle('on');if(e2.classList.contains('on'))e2.innerHTML=cms(p)}
else if(a==='send'){const i=c.querySelector('.cin input'),v=i.value.trim();if(!v)return;p.cm.push({u:ME,x:v});$('#c-'+p.id).innerHTML=cms(p);upd(p);save();c.querySelector('.cin input').focus()}
else if(a==='save'){p.sv=p.sv?0:1;upd(p);save();toast(p.sv?'Saved to bookmarks':'Removed from bookmarks')}
else if(a==='share'){const u=location.origin+location.pathname+'#'+p.id;try{if(navigator.share)await navigator.share({title:'VEXORA',text:(p.text||'').slice(0,100),url:u});else await navigator.clipboard.writeText(u),toast('Link copied');p.sh++;upd(p);save()}catch(x){}}
else if(a==='menu')sheet(`<button class="mi" data-m="save" data-id="${p.id}">${I('save')}${p.sv?'Remove from bookmarks':'Save post'}</button><button class="mi" data-m="link" data-id="${p.id}">${I('link')}Copy link</button><button class="mi" data-m="hide" data-id="${p.id}">${I('eye')}Hide post</button>${p.u===ME?`<button class="mi del" data-m="del" data-id="${p.id}">${I('trash')}Delete post</button>`:''}`)};
$('#feed').onkeydown=e=>{if(e.key==='Enter'&&e.target.closest('.cin'))e.target.closest('.cin').querySelector('[data-a=send]').click()};
$('#sh').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m,p=posts.find(x=>x.id===b.dataset.id);
if(m==='sw'){document.querySelectorAll('.sw button').forEach(x=>x.classList.toggle('on',x===b));return}
if(m==='mk'){const x=$('#stx').value.trim(),i=[...document.querySelectorAll('.sw button')].findIndex(z=>z.classList.contains('on'));if(!x)return toast('Write something first');stories.unshift({n:'Your story',on:1,g:GR[i],x});renderStories();toast('Story shared')}
else if(m==='save'){p.sv=p.sv?0:1;upd(p);toast(p.sv?'Saved to bookmarks':'Removed from bookmarks')}
else if(m==='link')copy(location.origin+location.pathname+'#'+p.id);
else if(m==='hide'){p.hid=1;renderFeed();toast('Post hidden')}
else if(m==='del'){posts=posts.filter(x=>x!==p);renderFeed();toast('Post deleted')}
else if(m==='feel'){C.feel=b.dataset.k;prev()}
save();closeSheet()};
/* ---------- composer ---------- */
const C={img:null,vid:null,feel:null,vis:'public'};
const upPb=()=>{$('#pb').disabled=!($('#q').value.trim()||C.img||C.vid)};
function prev(){$('#pv').innerHTML=(C.feel?`<p class="fl" style="margin-bottom:6px">Feeling ${esc(C.feel)}</p>`:'')+(C.img?`<img class="pm" alt="" src="${C.img}">`:C.vid?`<video class="pm" src="${C.vid}" controls playsinline></video>`:'')+((C.img||C.vid)?`<button class="x" id="rm" aria-label="Remove">${I('x')}</button>`:'');upPb()}
const visUI=()=>{$('#vis').innerHTML=I(C.vis==='public'?'globe':'lock')+(C.vis==='public'?'Public':'Friends only')};visUI();
$('#vis').onclick=()=>{C.vis=C.vis==='public'?'friends':'public';visUI()};
$('#q').oninput=upPb;$('#q').onkeydown=e=>{if(e.key==='Enter'&&!$('#pb').disabled)$('#pb').click()};
$('#bi').onclick=()=>$('#fi').click();$('#bv').onclick=()=>$('#fv').click();
const shrink=f=>new Promise((ok,no)=>{const im=new Image,u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.75))};im.onerror=no;im.src=u});
$('#fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{C.img=await shrink(f);C.vid=null;prev()}catch(x){toast('That image could not be opened')}};
$('#fv').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>60e6)return toast('Video is too large (max 60 MB)');C.vid=URL.createObjectURL(f);C.img=null;prev()};
$('#pv').onclick=e=>{if(e.target.closest('#rm')){C.img=C.vid=null;prev()}};
$('#bf').onclick=()=>sheet(`<h3>How are you feeling?</h3><div class="chips">${['Happy 😊','Loved 😍','Grateful 🙏','Cool 😎','Thinking 🤔','Sad 😢','Celebrating 🥳'].map(f=>`<button data-m="feel" data-k="${f}">${f}</button>`).join('')}</div>`);
$('#pb').onclick=()=>{posts.unshift({id:'m'+Date.now(),u:ME,on:1,t:Date.now(),vis:C.vis,text:$('#q').value.trim(),feel:C.feel,img:C.img,vid:C.vid,l:0,h:0,cn:0,sh:0,me:null,sv:0,cm:[]});$('#q').value='';C.img=C.vid=C.feel=null;prev();filter='';$('#sq').value='';renderFeed();save();scrollTo({top:0,behavior:'smooth'});toast('Posted!')};
/* ---------- header ---------- */
$('#bs').onclick=()=>{$('#sb').classList.toggle('on');if($('#sb').classList.contains('on'))$('#sq').focus();else{filter='';$('#sq').value='';renderFeed()}};
$('#sq').oninput=e=>{filter=e.target.value.trim();renderFeed()};
$('#bn').onclick=()=>{$('#bb').style.display='none';sheet(`<h3>Notifications</h3>${[['Aisha Yusuf','liked your post'],['Mustapha Danjuma','commented: “Great!”'],['Zainab Musa','started following you']].map(n=>`<div class="mi">${av(n[0],'sm')}<div><b>${n[0]}</b> ${n[1]}<small>Sample notification</small></div></div>`).join('')}`)};
/* ---------- backend status (real check, nothing is faked) ---------- */
fetch('/api/health').then(r=>r.json()).then(j=>{$('#mode').textContent=j&&j.services&&j.services.database==='ready'?'':'Demo mode · posts are saved on this device only'}).catch(()=>{$('#mode').textContent='Preview · posts are saved on this device only'});
renderStories();
})();
</script>
</body>
</html>
